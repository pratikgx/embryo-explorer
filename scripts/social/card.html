</style></head><body><div class="halo"></div><div class="copy"><p class="eyebrow">Human development in 3D</p><h1>Embryo<br>Explorer</h1><p class="description">16 stages. From the first cell<br>to pregnancy week 40.</p><p class="features">Rotate · Separate · Explore</p></div><canvas id="scene"></canvas><div class="domain">embryoexplorer.com ↗</div><div class="note">Illustrative anatomy</div><script type="module">
import * as T from 'three';import {buildStage} from './models.js';
const renderer=new T.WebGLRenderer({canvas:document.querySelector('canvas'),alpha:true,antialias:true});renderer.setPixelRatio(2);renderer.setSize(640,555,false);renderer.setClearColor(0xffffff,0);renderer.outputColorSpace=T.SRGBColorSpace;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.02;
const scene=new T.Scene();scene.add(new T.HemisphereLight(0xffffff,0x99968b,1.75));const key=new T.DirectionalLight(0xfff5ed,3.3);key.position.set(3,6,7);scene.add(key);const rim=new T.DirectionalLight(0xe4edf1,1.8);rim.position.set(-4,2,-4);scene.add(rim);const fill=new T.DirectionalLight(0xfff9f1,.45);fill.position.set(-3,0,3);scene.add(fill);
const model=await buildStage(11);for(const [name,part] of Object.entries(model.userData.parts))part.visible=name==='body';scene.add(model);const part=model.userData.parts.body;const bounds=new T.Box3().setFromObject(part),center=bounds.getCenter(new T.Vector3()),points=[];for(const x of [bounds.min.x,bounds.max.x])for(const y of [bounds.min.y,bounds.max.y])for(const z of [bounds.min.z,bounds.max.z])points.push(new T.Vector3(x,y,z));
const direction=new T.Vector3(.48,.06,1).normalize(),right=new T.Vector3().crossVectors(new T.Vector3(0,1,0),direction).normalize(),up=new T.Vector3().crossVectors(direction,right),camera=new T.PerspectiveCamera(33,640/555,.01,100),tan=Math.tan(T.MathUtils.degToRad(33/2));let distance=.1;for(const p of points){const d=p.clone().sub(center);distance=Math.max(distance,Math.abs(d.dot(up))/tan+d.dot(direction),Math.abs(d.dot(right))/(tan*camera.aspect)+d.dot(direction));}camera.position.copy(center).addScaledVector(direction,distance*1.02);camera.lookAt(center);renderer.render(scene,camera);document.body.dataset.ready='true';
</script></body></html>
