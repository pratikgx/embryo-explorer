<!doctype html><html><head><meta charset="utf-8"><title>Walkthrough capture</title><style>*{box-sizing:border-box}html,body{margin:0;background:#e9ece5}iframe{display:block;width:1920px;height:1080px;border:0}#controls{height:40px;display:flex;gap:12px;align-items:center;padding:5px 20px;font:12px system-ui}input{width:160px}</style></head><body><iframe id="app" src="./index.html?capture=1"></iframe><div id="controls"><label>Capture frame <input id="frame" type="number" min="0" max="599" step="1" value="0"></label><span id="ready">Loading</span></div><script>const app=document.getElementById('app');document.getElementById('frame').addEventListener('input',e=>app.contentWindow.dispatchEvent(new CustomEvent('capture-frame',{detail:Number(e.target.value)})));window.addEventListener('message',e=>{if(e.origin!==location.origin||!Number.isFinite(e.data.captureFrame))return;document.body.dataset.frame=e.data.captureFrame;document.getElementById('ready').textContent='Frame '+e.data.captureFrame+' ready';});</script></body></html>
